name: Costruisci APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Librerie JavaScript messe dentro l'app, così funziona senza internet
      - name: Scarica librerie (pdf.js, JSZip, jsPDF)
        run: |
          mkdir -p app/src/main/assets/lib
          cd app/src/main/assets/lib
          B=https://cdnjs.cloudflare.com/ajax/libs
          curl -fsSL -o pdf.min.js        $B/pdf.js/3.11.174/pdf.min.js
          curl -fsSL -o pdf.worker.min.js $B/pdf.js/3.11.174/pdf.worker.min.js
          curl -fsSL -o jszip.min.js      $B/jszip/3.10.1/jszip.min.js
          curl -fsSL -o jspdf.umd.min.js  $B/jspdf/2.5.1/jspdf.umd.min.js
          ls -la

      - name: Compila
        run: gradle :app:assembleRelease -PbuildNumber=${{ github.run_number }} --no-daemon

      - name: Rinomina APK
        run: cp app/build/outputs/apk/release/app-release.apk Anonimizzatore.apk

      - name: Pubblica come Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Anonimizzatore 1.0.${{ github.run_number }}
          body: |
            Scarica **Anonimizzatore.apk** qui sotto e installalo sul telefono.
            Commit: ${{ github.sha }}
          files: Anonimizzatore.apk
          make_latest: true
